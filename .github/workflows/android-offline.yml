name: Extrudo Android Offline Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'android-v*'

permissions:
  contents: read

jobs:
  build:
    name: Build offline Android web bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Extrudo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download geometry WASM
        run: pnpm wasm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Extrudo web application
        run: pnpm --filter @extrudo/web build
        env:
          SITE_URL: http://127.0.0.1:8080

      - name: Verify build files
        run: |
          test -f apps/web/dist/index.html
          test -f apps/web/dist/sw.js
          test -d apps/web/dist/assets
          echo "Extrudo offline web build verified"
          find apps/web/dist -maxdepth 2 -type f | head -50

      - name: Package Android offline bundle
        run: |
          mkdir -p release
          cat > release/ANDROID-SETUP.txt <<'EOF'
          EXTRUDO ANDROID OFFLINE INSTALLATION

          1. Extract the site directory.
          2. Copy its contents to your Android HTTP server root.
          3. Bind the server to 127.0.0.1.
          4. Use port 8080.
          5. Open http://127.0.0.1:8080 in Chrome.
          6. Open once while connected to install/cache the application.
          7. Test again in airplane mode.

          IMPORTANT:
          The server must support the required response headers
          documented in apps/web/public/_headers.
          Use loopback localhost, not a plain HTTP LAN IP.
          EOF

          mkdir -p release/site
          cp -a apps/web/dist/. release/site/
          cd release
          zip -qr extrudo-android-offline.zip site ANDROID-SETUP.txt

      - name: Upload offline bundle
        uses: actions/upload-artifact@v4
        with:
          name: extrudo-android-offline
          path: release/extrudo-android-offline.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach bundle to Android release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/extrudo-android-offline.zip
